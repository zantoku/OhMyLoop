[package]
name = "ohmyloop-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "OhMyLoop desktop music practice player"

[dependencies]
ohmyloop = { path = "..", features = ["beat-analysis"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
