[package]
name = "ohmyloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Native audio engine for a cross-platform music practice player"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
beat-this = { version = "=1.1.0", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
anyhow = "1.0"
cpal = "0.16"
crossbeam-queue = "0.3"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.5", features = ["all"] }
rubato = "0.16"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
beat-analysis = ["dep:beat-this", "dep:reqwest"]

[build-dependencies]
cc = "1.2"

[dev-dependencies]
crossterm = "0.29"

[profile.release]
debug = 1

[[example]]
name = "analysis_probe"
required-features = ["beat-analysis"]

# Inference kernels must remain optimized in `tauri dev`; app code keeps its
# normal debug profile. Otherwise long-song analysis can take minutes per segment.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.beat-this]
opt-level = 3
[profile.dev.package."rubato:0.16.2"]
opt-level = 3
[profile.dev.package.hound]
opt-level = 3
