[package]
name = "ohmyloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Native audio engine for a cross-platform music practice player"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1.0"
cpal = "0.16"
crossbeam-queue = "0.3"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.5", features = ["all"] }
rubato = "0.16"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"

[profile.release]
debug = 1
